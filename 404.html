  <style>
    :root {
      --ink: #18211f; --muted: #4b5551; --paper: #f7f5ef; --white: #ffffff;
      --green: #1f5d45; --green-dark: #143f30; --lime: #c9e86a;
      --yellow: #f5c84b; --orange: #e8793d; --line: #dce1d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: var(--ink); background: var(--paper);
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; padding: 40px 20px;
    }
    .logo { max-height: 64px; margin-bottom: 32px; }
    .code { font-size: 5.5rem; font-weight: 900; letter-spacing: -.03em; color: var(--green-dark); line-height: 1; margin: 0; }
    .code span { color: var(--lime); -webkit-text-stroke: 2px var(--green-dark); }
    h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; margin: 18px 0 10px; max-width: 520px; }
    p { color: var(--muted); font-size: 1.05rem; max-width: 460px; margin: 0 0 32px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 999px; font-weight: 800; font-size: .95rem; text-decoration: none; }
    .btn-primary { background: var(--green-dark); color: #fff; }
    .btn-primary:hover { background: var(--green); }
    .btn-outline { border: 1.5px solid var(--line); color: var(--ink); }
    .btn-outline:hover { border-color: var(--green); color: var(--green-dark); }
  </style>
</head>
